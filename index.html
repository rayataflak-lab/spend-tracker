<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="دخل و خرج">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#12232B">
<title>دخل و خرج</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1EF;--card:#fff;--ink:#12232B;--mute:#62757D;--line:#D8E0DD;--inc:#0E8A6A;--exp:#C6473D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A1F;--card:#16262D;--ink:#E8F0EE;--mute:#93A7AE;--line:#253941;--inc:#3CC79F;--exp:#F0786D}}
:root[data-theme="dark"]{--bg:#0E1A1F;--card:#16262D;--ink:#E8F0EE;--mute:#93A7AE;--line:#253941;--inc:#3CC79F;--exp:#F0786D}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 14px 60px}
.hero{padding:10px 4px 18px}
.hero small{color:var(--mute);font-size:14px}
.big{font-size:44px;font-weight:800;line-height:1.2;letter-spacing:-.5px}
.big.neg{color:var(--exp)}
.sub{display:flex;gap:18px;margin-top:6px;font-size:14px;color:var(--mute)}
.sub b{color:var(--ink);font-weight:600}
.sub .i b{color:var(--inc)}.sub .e b{color:var(--exp)}
.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:8px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:15px;font-weight:800}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#q{font-size:18px;padding:14px}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}
.row select{flex:1}
.btn{border:0;background:var(--ink);color:var(--bg);font:inherit;font-weight:600;border-radius:10px;padding:10px 16px;cursor:pointer;white-space:nowrap}
.btn.g{background:none;color:var(--ink);border:1px solid var(--line)}
.pv{color:var(--mute);font-size:14px;min-height:22px;margin-top:8px}
.day{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin:14px 2px 6px}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.it .t{flex:1;min-width:0}.it .t div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t div+div{font-size:12px;color:var(--mute)}
.amt{font-weight:600;white-space:nowrap}.amt.i{color:var(--inc)}.amt.e{color:var(--exp)}
.x{border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;padding:4px 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;padding:5px 12px;border-radius:99px;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tot div{font-size:12px;color:var(--mute)}.tot b{display:block;font-size:16px;color:var(--ink)}
.dn{display:flex;gap:14px;align-items:center}
.lg{flex:1;font-size:13px}.lg div{display:flex;align-items:center;gap:6px;padding:2px 0}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}.lg span{flex:1}.lg em{font-style:normal;color:var(--mute)}
.sc{overflow-x:auto}
.empty{color:var(--mute);text-align:center;padding:26px 10px;font-size:14px}
.top{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:14px}.top:first-of-type{border-top:0}
.top small{color:var(--mute)}
textarea{height:110px;direction:ltr;font-size:12px;margin-top:8px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.s{opacity:1}
[hidden]{display:none!important}
.ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none}
.cr{display:flex;gap:10px;align-items:center;padding:7px 0}.cb{flex:1;min-width:0}.cb>div:first-child{display:flex;gap:8px;font-size:14px}.cb span{flex:1}.cb em{font-style:normal;color:var(--mute);width:34px;text-align:left}
.br{height:6px;background:var(--line);border-radius:4px;margin-top:4px;overflow:hidden}.br i{display:block;height:100%;border-radius:4px}
.cmp{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}.cmp b{color:var(--ink)}.up{color:var(--exp)}.dn_{color:var(--inc)}
.lgd{font-size:12px;color:var(--mute);margin-top:6px}.lgd i{display:inline-block;width:9px;height:9px;border-radius:3px;margin:0 8px 0 3px}
.pv b{color:var(--ink)}.chips{overflow-x:auto;flex-wrap:nowrap}.chips button{white-space:nowrap}
label{display:block;font-size:13px;color:var(--mute);margin-top:8px}label input,label select{margin-top:4px;color:var(--ink)}
#md{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.mb{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.emo,.sw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.emo button{border:1px solid var(--line);background:var(--bg);border-radius:8px;font-size:18px;width:38px;height:38px;cursor:pointer}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}.sw button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.mu{color:var(--mute);font-size:12px}.cb small{color:var(--mute);font-size:12px}.it{cursor:pointer}
.tabs button{font-size:14px}
</style>
</head>
<body>
<main>
<section class="hero"><small id="hl"></small><div class="big" id="bal"></div><div class="sub"><span class="i">درآمد <b id="hi"></b></span><span class="e">خرج <b id="he"></b></span></div><div id="hbud"></div></section>
<div class="tabs" role="tablist"><button class="on" data-t="add">ثبت</button><button data-t="rep">گزارش</button><button data-t="set">تنظیمات</button></div>

<section id="add">
<div class="card">
<input id="q" placeholder="نهار ۱۲۰ دیروز" enterkeyhint="done" autocomplete="off">
<div class="pv" id="pv"></div>
<div class="row" id="ar" hidden><select id="cs" aria-label="دسته"></select><button class="btn" id="ab">ثبت</button></div>
</div>
<div id="bd"></div>
<div id="list"></div>
</section>

<section id="rep" hidden>
<div class="chips" id="rg"><button data-r="w" class="on">این هفته</button><button data-r="m">این ماه</button><button data-r="p">ماه قبل</button><button data-r="t">۳۰ روز اخیر</button><button data-r="a">همه</button></div>
<div id="rb"></div>
</section>
<section id="set" hidden>
<div class="card"><h3>دسته‌های من</h3>
<div class="row" style="margin-top:0"><input id="ce" value="🏷️" style="width:64px;text-align:center" aria-label="آیکون"><input id="cn" placeholder="اسم دسته، مثلاً سیگار"><select id="ck" style="width:90px" aria-label="نوع"><option value="e">خرج</option><option value="i">درآمد</option></select></div>
<input id="cw" placeholder="کلمه‌های تشخیص (اختیاری، با فاصله)" style="margin-top:8px">
<div class="emo" id="em"></div><div class="sw" id="sw"></div>
<div class="row"><button class="btn" id="cadd">افزودن دسته</button></div><div id="cl"></div></div>
<div class="card"><h3>بودجه ماهانه</h3>
<label>کل بودجه خرج ماه (تومان)<input id="bt" inputmode="decimal" placeholder="مثلاً ۲۰ میلیون"></label>
<div class="mu" style="margin-top:12px">بودجه یک دسته</div>
<div class="row" style="margin-top:4px"><select id="bcs" aria-label="دسته"></select><input id="bca" placeholder="مبلغ" style="width:110px"><button class="btn" id="bcad">افزودن</button></div><div id="bl"></div></div>
<div class="card"><h3>ثبت‌های تکراری ماهانه</h3><div class="mu">مثل قسط و اجاره. هر ماه در روز تعیین‌شده خودکار ثبت می‌شن، به شرطی که برنامه را باز کنی.</div>
<select id="rc" style="margin-top:8px" aria-label="دسته"></select>
<div class="row"><input id="ra" placeholder="مبلغ، مثلاً ۱۲ میلیون"><input id="rd" inputmode="numeric" placeholder="روز ماه" style="width:100px"></div>
<input id="rn" placeholder="شرح (اختیاری)" style="margin-top:8px">
<div class="row"><button class="btn" id="rad">افزودن</button></div><div id="rl"></div></div>
<div class="card"><h3>پشتیبان و خروجی</h3>
<div class="row" style="margin-top:0"><button class="btn" id="bx">خروجی اکسل</button><button class="btn g" id="bb">دانلود بکاپ</button><button class="btn g" id="br">بازیابی</button></div>
<div id="rs" hidden><textarea id="ta" placeholder="محتوای بکاپ را اینجا بچسبان"></textarea><div class="row"><button class="btn" id="rgo">بازیابی</button></div></div>
</div>
</section>
</main>
<div id="md" hidden><div class="mb"><h3>ویرایش</h3><label>مبلغ (تومان)<input id="ma" inputmode="decimal"></label><label>دسته<select id="mc"></select></label><label>شرح<input id="mn"></label><label>تاریخ شمسی<input id="mt" inputmode="numeric" placeholder="۱۴۰۵/۷/۶"></label><div class="row"><button class="btn" id="msv">ذخیره</button><button class="btn g" id="mdl">حذف</button><button class="btn g" id="mcl">بستن</button></div></div></div>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s),DAY=864e5;
const pd=n=>String(n).replace(/\d/g,c=>'۰۱۲۳۴۵۶۷۸۹'[c]);
const fa=n=>Math.round(n).toLocaleString('fa-IR');
const D=x=>x.replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[,٬،]/g,'');
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const pf=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'});
const jp=t=>{const p={};pf.formatToParts(new Date(t)).forEach(o=>p[o.type]=o.value);return{y:+p.year,m:+p.month,d:+p.day}};
const dm=t=>{const j=jp(t);return pd(j.d)+' '+MN[j.m-1]};
const dfull=t=>{const j=jp(t);return pd(j.y+'/'+j.m+'/'+j.d)};
const sod=(t=Date.now())=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const addD=(t,n)=>{const d=new Date(t);d.setDate(d.getDate()+n);return d.getTime()};
const mStart=t=>addD(sod(t),-(jp(t).d-1));
const mNext=t=>{let y=addD(mStart(t),28);while(jp(y).d!==1)y=addD(y,1);return y};

const E=(n,i,c,kw)=>({n,i,c,k:'e',kw}),I=(n,i,c,kw)=>({n,i,c,k:'i',kw});
const CATS=[
E('نون','🥖','#C9A227','نون نان بربری سنگک لواش تافتون'),
E('خوراکی','🍿','#E08A3C','خوراکی تنقلات چیپس پفک شکلات آجیل بیسکویت شیرینی بستنی نوشابه سوپرمارکت خواربار لبنیات'),
E('میوه','🍎','#4F8F6B','میوه سبزی صیفی'),
E('رستوران','🍽️','#C6473D','رستوران غذا ناهار نهار شام صبحانه پیتزا ساندویچ کباب فست_فود اسنپ_فود'),
E('کافه','☕','#8B5E3C','کافه قهوه کافی_شاپ چای'),
E('کرایه تاکسی','🚕','#D9A21B','تاکسی اسنپ تپسی کرایه مترو اتوبوس آژانس'),
E('بنزین و ماشین','⛽','#5B6770','بنزین ماشین موتور پارکینگ عوارض کارواش روغن لاستیک'),
E('دکتر','🩺','#B4487A','دکتر دارو داروخانه ویزیت دندان آزمایش درمان بیمارستان عینک'),
E('آرایشگاه','💈','#7A6BB0','آرایشگاه ارایشگاه سلمونی اصلاح کوتاهی ناخن ابرو'),
E('بهداشتی','🧴','#3FA3A0','بهداشتی شامپو صابون خمیردندان عطر کرم'),
E('لباس','👕','#3F7FA6','لباس کفش شلوار پیراهن کیف جوراب کت'),
E('هدیه','🎁','#D0577F','هدیه کادو عیدی'),
E('اجاره خونه','🏠','#8A6D3B','اجاره اجاره_خونه اجاره_خانه رهن ودیعه'),
E('قبض','🧾','#E0703C','قبض برق گاز آب_و_فاضلاب شارژ_ساختمان'),
E('شارژ و اینترنت','📱','#2F9E8F','اینترنت شارژ سیمکارت موبایل همراه_اول ایرانسل'),
E('قسط','💳','#B03A48','قسط اقساط'),
E('لوازم نظافت منزل','🧽','#4FB0C6','لوازم_نظافت نظافت شوینده پودر ظرفشویی جارو دستمال سطل سفیدکننده'),
E('لوازم منزل','🛋️','#9A7B4F','لوازم_منزل لوازم_خونه ظرف یخچال مبل فرش پرده'),
E('تعمیرات','🔧','#6B7F8C','تعمیر تعمیرات لوله_کش برقکار'),
E('آموزش','📚','#3E5FA8','آموزش کتاب کلاس دوره ترم شهریه'),
E('تفریح','🎬','#8E5BC4','سینما فیلم بازی تفریح کنسرت تئاتر بلیت'),
E('سفر','✈️','#2E86C1','سفر هتل بلیط پرواز'),
E('ورزش','🏋️','#4C9F38','ورزش باشگاه استخر'),
E('اشتراک','🔁','#5E6AD2','اشتراک نتفلیکس اسپاتیفای فیلیمو'),
E('خیریه','🤲','#A67C52','خیریه صدقه کمک نذر'),
E('متفرقه','📦','#8A8F94',''),
I('حقوق','💼','#0E8A6A','حقوق دستمزد'),
I('ترانه','💚','#2FA36B','ترانه'),
I('پروژه','🛠️','#1C7C9C','پروژه فریلنس'),
I('اجاره پارکینگ','🅿️','#5C8F2E','اجاره_پارکینگ'),
I('وام','🏦','#B58A1B','وام'),
I('هدیه','🎁','#D0577F','هدیه کادو عیدی'),
I('فروش','🏷️','#2E8B8B','فروش'),
I('سایر درآمد','➕','#6E8B74','درآمد درامد واریز دریافت')
];
const nz=s=>s.replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u200c\s_]/g,'');
const BASE=CATS.slice();
function syncCats(){CATS.length=0;CATS.push(...BASE,...S.cats);CATS.forEach(c=>{c.K=[nz(c.n),...(c.kw||'').split(' ').map(nz)].filter(Boolean)})}
const cat=(n,k)=>CATS.find(c=>c.n==n&&c.k==k)||{i:'📦',c:'#8A8F94'};
const wf=new Intl.DateTimeFormat('fa-IR',{weekday:'long'});
const dayLabel=t=>{const n=sod();return t==n?'امروز':t==addD(n,-1)?'دیروز':t==addD(n,1)?'فردا':t==addD(n,-2)?'پریروز':wf.format(t)};
const DEF=()=>({e:[],cats:[],bud:{t:0,c:{}},rec:[]});
let S=DEF();
try{const r=localStorage.getItem('dk1');if(r)S=Object.assign(DEF(),JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('dk1',JSON.stringify(S))}catch(e){}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2200)};

const HINT='مثلاً: «نهار ۱۲۰ دیروز» یا «حقوق +۲۵ میلیون فردا» یا «قبض برق ۳۵۰ هزار ۱۵ مهر». مبلغ زیر ۱۰۰۰ را هزار تومان حساب می‌کنم.';
function j2t(y,m,d){const n=sod();for(let i=-400;i<=400;i++){const t=addD(n,i),j=jp(t);if(j.y==y&&j.m==m&&j.d==d)return t}return n}
function pdate(t){
  const n=sod();let m;
  if(m=t.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/))return{t:j2t(+m[1],+m[2],+m[3]),s:t.replace(m[0],' ')};
  if(m=t.match(new RegExp('(\\d{1,2})\\s*('+MN.join('|')+')(?![\\u0600-\\u06FF])')))return{t:j2t(jp(n).y,MN.indexOf(m[2])+1,+m[1]),s:t.replace(m[0],' ')};
  if(m=t.match(/(\d+)\s*روز\s*(پیش|قبل)/))return{t:addD(n,-m[1]),s:t.replace(m[0],' ')};
  const w=[[/پس\s*فردا/,2],[/پریروز/,-2],[/دیروز/,-1],[/فردا/,1],[/امروز/,0]];
  for(const[r,o]of w)if(r.test(t))return{t:addD(n,o),s:t.replace(r,' ')};
  return{t:n,s:t};
}
function parse(t){
  t=D(t.trim().replace(/\u200c/g,' '));if(!t)return null;
  const dd=pdate(t);t=dd.s;
  const m=t.match(/(\d+(?:\.\d+)?)\s*(میلیون|هزار|تومان|تومن|k)?/i);if(!m)return null;
  let a=parseFloat(m[1]),u=m[2]&&m[2].toLowerCase();
  a*=u=='میلیون'?1e6:(u=='هزار'||u=='k')?1e3:u?1:(a<1000?1000:1);
  const plus=/\+/.test(t),rest=t.replace(m[0],' ').replace(/[+\-]/g,' ').replace(/\s+/g,' ').trim(),R=nz(rest);
  let best=null,bl=0;
  for(const c of CATS){if(plus&&c.k=='e')continue;for(const k of c.K)if(R.includes(k)&&k.length>bl){best=c;bl=k.length}}
  if(!best)best=CATS.find(c=>c.n==(plus?'سایر درآمد':'متفرقه'));
  return{a,k:best.k,c:best.n,n:rest,t:dd.t};
}
let P=null;
const selHTML=ko=>['e','i'].filter(k=>!ko||k==ko).map(k=>`<optgroup label="${k=='e'?'خرج':'درآمد'}">`+CATS.filter(c=>c.k==k).map(c=>`<option value="${k}|${esc(c.n)}">${c.i} ${esc(c.n)}</option>`).join('')+'</optgroup>').join('');
function fillSel(){const v=$('#cs').value;$('#cs').innerHTML=$('#mc').innerHTML=$('#rc').innerHTML=selHTML();$('#bcs').innerHTML=selHTML('e');if(v)$('#cs').value=v}
function pv(){
  if(!P){$('#pv').textContent=HINT;return}
  const c=cat(P.c,P.k);
